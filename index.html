<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopEase | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#4f46e5,#06b6d4);
    background-size:300% 300%;
    animation:bg 8s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:1000px;
    max-width:95%;
    display:flex;
    border-radius:25px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.left{
    width:50%;
    background:linear-gradient(135deg,#1d4ed8,#06b6d4);
    color:#fff;
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1{
    font-size:48px;
    margin-bottom:20px;
}

.left h2{
    font-size:32px;
    margin-bottom:15px;
}

.left p{
    font-size:17px;
    line-height:30px;
    margin-bottom:40px;
}

.left img{
    width:100%;
    max-width:350px;
    align-self:center;
}

.right{
    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px;
}

form{
    width:100%;
}

form h2{
    text-align:center;
    color:#1e293b;
    font-size:35px;
    margin-bottom:35px;
}

.input-box{
    position:relative;
    margin-bottom:25px;
}

.input-box i{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:#2563eb;
    font-size:18px;
}

.input-box input{
    width:100%;
    padding:16px 18px 16px 50px;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

.input-box input:focus{
    border-color:#2563eb;
    box-shadow:0 0 12px rgba(37,99,235,.2);
}

.login-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#2563eb,#06b6d4);
    color:#fff;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(37,99,235,.35);
}

.footer{
    margin-top:30px;
    text-align:center;
    color:#777;
    font-size:14px;
}

@media(max-width:900px){

.container{
    flex-direction:column;
}

.left,
.right{
    width:100%;
}

.left{
    text-align:center;
    padding:40px;
}

.left img{
    max-width:250px;
}

.right{
    padding:35px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<h1>🛒 ShopEase</h1>

<h2>Welcome Back!</h2>

<p>
Enjoy a faster, smarter, and secure shopping experience.
Explore Electronics, Fashion, Grocery, Shoes, Watches,
Mobiles and much more with exclusive offers.
</p>

<img src="images/shopping.png" alt="Shopping">

</div>

<div class="right">

<form id="loginForm">

<h2>Sign In</h2>

<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" id="username" placeholder="Username" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="password" placeholder="Password" required>
</div>

<button type="submit" class="login-btn">
<i class="fa-solid fa-right-to-bracket"></i>
&nbsp; Login
</button>

<div class="footer">
© 2026 <b>ShopEase</b> • Secure Login Portal
</div>

</form>

</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();

    if (username === "") {
        alert("Please enter your username.");
        return;
    }

    if (password === "") {
        alert("Please enter your password.");
        return;
    }

    alert("Login Successful!");

    window.location.href = "home.html";

});
</script>

</body>
</html>
